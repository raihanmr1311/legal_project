<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .login-card {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 3px 20px rgba(0,0,0,0.07);
            padding: 2.5rem 2rem 2rem 2rem;
            margin-top: 5rem;
        }
        .logo-wrapper .eye-badge{
            position:absolute;
            right:-8px;
            top:-8px;
            background:#fff;
            border-radius:50%;
            padding:4px;
            box-shadow:0 2px 6px rgba(0,0,0,0.12);
            display:flex;
            align-items:center;
            justify-content:center;
            width:34px;
            height:34px;
        }
        .logo-wrapper .eye-badge svg{display:block}
    </style>
</head>
<body>
    <div class="vh-100 d-flex align-items-center justify-content-center">
        <div class="login-wrapper text-center">
            <div class="logo-wrapper mb-1" style="display:inline-block; position:relative;">
                <img src="Assets/img/logo.png" alt="SItem Pelaporan BSP" class="login-logo" style="height:72px; object-fit:contain">
                <!-- Eye logo badge -->
                <div class="eye-badge" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" focusable="false">
                        <path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7z" stroke="#0d6efd" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="12" cy="12" r="3" stroke="#0d6efd" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="12" cy="12" r="1.2" fill="#0d6efd" />
                    </svg>
                </div>
            </div>
            <div class="login-site-title fw-bold fs-5 mb-3">SItem Pelaporan BSP</div>
            <div class="login-card mx-auto shadow-sm">

                <p class="text-muted small mb-3">Silakan login dengan akun Anda.</p>
                <form id="loginForm">
                    <div class="mb-3 text-start">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    <div class="mb-3 text-start">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" required>
                            <button type="button" class="btn btn-outline-secondary" id="togglePwd" tabindex="-1">
                                <i class="bi bi-eye" id="togglePwdIcon"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="loginBtn">Masuk</button>
                    <div id="loginError" class="text-danger text-center mt-3" style="display:none;"></div>
                </form>
            </div>
        </div>
    </div>
    <footer class="site-footer mt-4 py-3 text-center text-muted">
        <div class="container d-flex justify-content-center align-items-center gap-2">
            <div>© SItem Pelaporan BSP</div>
        </div>
    </footer>
    <style>
        .site-footer{background:transparent;font-size:0.95rem}
    </style>
        </div>
    </div>
    <script>
    // Toggle password visibility
    document.getElementById('togglePwd').addEventListener('click', function() {
        const pwd = document.getElementById('password');
        const icon = document.getElementById('togglePwdIcon');
        if (pwd.type === 'password') { pwd.type = 'text'; icon.classList.remove('bi-eye'); icon.classList.add('bi-eye-slash'); }
        else { pwd.type = 'password'; icon.classList.remove('bi-eye-slash'); icon.classList.add('bi-eye'); }
    });

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const loginBtn = document.getElementById('loginBtn');
        loginBtn.disabled = true;
        const origText = loginBtn.textContent;
        loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Memproses...';

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userRole', data.role || 'user');
                if (data.userId) localStorage.setItem('userId', String(data.userId));
                if (data.perseroan) localStorage.setItem('perseroanName', data.perseroan);
                if (typeof data.perseroan_id !== 'undefined' && data.perseroan_id !== null) localStorage.setItem('perseroanId', String(data.perseroan_id));
                window.location.href = '/main.html';
            } else {
                document.getElementById('loginError').style.display = 'block';
                document.getElementById('loginError').textContent = data.message || 'Login gagal';
            }
            
        } catch (err) {
            document.getElementById('loginError').style.display = 'block';
            document.getElementById('loginError').textContent = 'Gagal terhubung ke server.';
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = origText;
        }
    });
    </script>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
    body{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial}
    .login-wrapper{max-width:420px;width:100%;padding:24px}
    .login-logo{height:72px;object-fit:contain}
    .login-card{background:#fff;border-radius:14px;padding:22px}
    body{background:linear-gradient(135deg,#f0f6ff 0%,#f8fbff 60%)}
    </style>
</body>
</html>
