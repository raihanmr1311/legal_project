<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manajemen User - TEPAT BSP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            padding-top: 12px;
        }
        .navbar { border-radius: 0 0 8px 8px; }
        .content-card {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 3px 20px rgba(0,0,0,0.07);
            padding: 2.5rem 2rem 2rem 2rem;
        }
        .table thead th {
            vertical-align: middle;
            background-color: #e67e22 !important;
            color: #000;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: center;
            padding: 10px 12px;
            border: 1px solid #c75a12;
            white-space: nowrap;
        }
        .table thead th:first-child {
            border-top-left-radius: 10px;
        }
        .table thead th:last-child {
            border-top-right-radius: 10px;
        }
        .table tbody td { vertical-align: middle; }
        .table-striped > tbody > tr:nth-of-type(odd) {
            background-color: #f3f8fd;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="main.html">
                <span class="fw-bold">TEPAT BSP</span>
            </a>
            <div class="d-flex align-items-center">
                <button class="btn btn-outline-secondary me-2" onclick="window.location.href='main.html'" title="Dashboard">
                    <i class="bi bi-house"></i> Dashboard
                </button>
                <button class="btn btn-danger" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>
    <div class="container py-5">
        <div class="content-card mx-auto" style="max-width: 1200px;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="mb-0">Manajemen User</h3>
                <button class="btn btn-primary" id="addUserBtn">
                    <i class="bi bi-plus-circle"></i> Tambah User
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-bordered table-striped" id="usersTable">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Username</th>
                            <th>Perseroan</th>
                            <th>Role</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="userModalLabel">Tambah User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="userForm">
                    <div class="modal-body">
                        <input type="hidden" id="userId" name="id">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3" id="passwordGroup">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password">
                            <small class="text-muted">Kosongkan jika tidak ingin mengubah password</small>
                        </div>
                        <div class="mb-3">
                            <label for="perseroan" class="form-label">Perseroan</label>
                            <select class="form-select" id="perseroan" name="perseroan" required>
                                <option value="">-- Pilih Perseroan --</option>
                                <option value="1">BSP Corporate</option>
                                <option value="2">PT. Bakrie Sumatera Plantations - Kisaran</option>
                                <option value="3">PT. Grahadura Leidong Prima</option>
                                <option value="4">PT. Bakrie Pasaman Plantations</option>
                                <option value="5">PT. Ciptalaras Cipta Indonesia</option>
                                <option value="6">PT. Agrowiyana</option>
                                <option value="7">PT. Sumbertama Nusa Pertiwi</option>
                                <option value="8">PT. Agro Mitra Madani</option>
                                <option value="9">PT. Huma Indah Mekar</option>
                                <option value="10">PT. Monrad Intan Barakat</option>
                                <option value="11">PT. Air Muring</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="role" class="form-label">Role</label>
                            <select class="form-select" id="role" name="role" required>
                                <option value="user">User</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary">Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">Konfirmasi Hapus</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Apakah Anda yakin ingin menghapus user <strong id="deleteUsername"></strong>?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Hapus</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="site-footer mt-4 py-3 text-center text-muted">
        <div class="container d-flex justify-content-center align-items-center gap-2">
            <div>© TEPAT BSP</div>
        </div>
    </footer>
    <style>
        .site-footer{background:transparent;font-size:0.95rem}
    </style>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Src/manage-users.js"></script>
</body>
</html>
