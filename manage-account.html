<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profil Saya - TEPAT BSP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg,#f8f9fa 0%,#e9ecef 100%); min-height:100vh; padding-top:12px }
        .card { border-radius: 14px }
        .site-footer{background:transparent;font-size:0.95rem}
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="main.html"><span class="fw-bold">TEPAT BSP</span></a>
            <div class="d-flex align-items-center">
                <button class="btn btn-outline-secondary me-2" onclick="window.location.href='main.html'">Kembali</button>
                <button class="btn btn-danger" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="card mx-auto" style="max-width:540px; padding:24px">
            <h4 class="mb-3">Profil Saya</h4>
            <form id="accountForm">
                <input type="hidden" id="userId" name="id">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Perseroan</label>
                    <input type="text" id="perseroanDisplay" class="form-control" readonly>
                    <input type="hidden" id="perseroanHidden" name="perseroan">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password Baru</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Kosongkan jika tidak ingin mengubah">
                    <div class="form-text">Kosongkan jika tidak ingin mengganti password.</div>
                </div>
                <button class="btn btn-primary" type="submit">Simpan Perubahan</button>
                <div id="msg" class="mt-3"></div>
            </form>
        </div>
    </div>

    <footer class="site-footer mt-4 py-3 text-center text-muted">
        <div class="container d-flex justify-content-center align-items-center gap-2">
            <div>© TEPAT BSP</div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Src/manage-account.js"></script>
</body>
</html>
